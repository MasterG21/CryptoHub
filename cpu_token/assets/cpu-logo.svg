<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Computing Power (CPU)">
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#4F7DF3"/>
      <stop offset="1"   stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FDFDFF"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0"   stop-color="#3B82F6" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="1"   stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="512" height="512" rx="116" fill="#0A0D14"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- pins: four per side, drawn as one stroked group so they stay even -->
  <g stroke="#5B6478" stroke-width="15" stroke-linecap="round">
    <path d="M158 92v40M218 92v40M294 92v40M354 92v40"/>
    <path d="M158 380v40M218 380v40M294 380v40M354 380v40"/>
    <path d="M92 158h40M92 218h40M92 294h40M92 354h40"/>
    <path d="M380 158h40M380 218h40M380 294h40M380 354h40"/>
  </g>

  <!-- die -->
  <rect x="128" y="128" width="256" height="256" rx="44"
        fill="#10151F" stroke="url(#die)" stroke-width="17"/>

  <!-- inner trace ring, kept thin so it drops away cleanly at small sizes -->
  <rect x="170" y="170" width="172" height="172" rx="26"
        fill="none" stroke="#22D3EE" stroke-width="3.5" stroke-opacity="0.35"/>

  <!-- power bolt: the 'power' half of Computing Power -->
  <path d="M286 168 L206 274 h44 l-24 90 l80 -110 h-44 z"
        fill="url(#bolt)" stroke="#0A0D14" stroke-width="7" stroke-linejoin="round"/>
</svg>
