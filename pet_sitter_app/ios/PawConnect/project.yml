name: PawConnect
options:
  bundleIdPrefix: com.pawconnect
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: PawConnect
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    # Backend base URL baked into the app at build time. Point this at your
    # deployed HTTPS backend before archiving for TestFlight/App Store —
    # see pet_sitter_app/DEPLOYMENT.md. http:// URLs will be blocked by App
    # Transport Security in a release build, by design.
    API_BASE_URL: "https://your-backend-domain.example.com"
    # Set this to your own Apple Developer Team ID (Xcode > Signing & Capabilities)
    DEVELOPMENT_TEAM: ""

targets:
  PawConnect:
    type: application
    platform: iOS
    sources:
      - path: PawConnect
        excludes:
          - "Resources/Assets.xcassets/**/Contents.json.bak"
    resources:
      - path: PawConnect/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawconnect.app
        PRODUCT_NAME: PawConnect
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    info:
      properties:
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
