<!doctype html>
<meta charset="utf-8">
<title>Animal Sounds Song — preview</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; background: #17132b; color: #fff; font: 15px/1.5 Fredoka, system-ui, sans-serif; }
  #wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
  #stage { position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
           border-radius: 14px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  canvas { width: 100%; height: 100%; display: block; }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button { font: 700 15px Fredoka, sans-serif; background: #ff5f8f; color: #fff; border: 0;
           padding: 10px 18px; border-radius: 999px; cursor: pointer; }
  button.alt { background: #3d3768; }
  input[type=range] { flex: 1; min-width: 220px; accent-color: #ff5f8f; }
  code { background: #262046; padding: 2px 6px; border-radius: 5px; }
  .hint { opacity: .7; font-size: 13px; }
</style>
<div id="wrap">
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div class="bar">
    <button id="play">▶ Play</button>
    <input type="range" id="seek" min="0" max="168" step="0.02" value="0">
    <span id="clock">0:00 / 2:48</span>
  </div>
  <div class="bar" id="jumps"></div>
  <p class="hint">Preview of the rendered video. Audio comes from
    <code>../out/animal-sounds-song.wav</code> once <code>render/build.sh</code> has run.
    The final upload file is <code>../out/animal-sounds-song.mp4</code>.</p>
</div>
<audio id="aud" src="../out/animal-sounds-song.wav" preload="auto"></audio>

<script src="core.js"></script>
<script src="animals.js"></script>
<script src="animals2.js"></script>
<script src="stage.js"></script>
<script src="story.js"></script>
<script src="script-data.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const DUR = AnimalVideo.setScript(window.SCRIPT);

// The renderer waits on this before grabbing frame 0, so no frame can ever be
// captured with a fallback font.
window.__ready = document.fonts.load('800 100px Baloo2')
  .then(() => document.fonts.load('700 100px Fredoka'))
  .then(() => document.fonts.ready)
  .then(() => { AnimalVideo.drawFrame(ctx, 0); return true; });

window.__drawAt = t => AnimalVideo.drawFrame(ctx, t);
window.__duration = DUR;

// ---- preview transport (unused by the headless renderer) ----
const aud = document.getElementById('aud'), seek = document.getElementById('seek'),
      playBtn = document.getElementById('play'), clock = document.getElementById('clock');
let playing = false, t0 = 0, base = 0;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
seek.max = DUR;

function frame() {
  if (playing) {
    const t = Math.min(DUR, base + (performance.now() - t0) / 1000);
    seek.value = t;
    if (t >= DUR) { playing = false; playBtn.textContent = '▶ Play'; aud.pause(); }
  }
  const t = +seek.value;
  AnimalVideo.drawFrame(ctx, t);
  clock.textContent = fmt(t) + ' / ' + fmt(DUR);
  requestAnimationFrame(frame);
}
playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? '❚❚ Pause' : '▶ Play';
  if (playing) { base = +seek.value; t0 = performance.now(); aud.currentTime = base; aud.play().catch(() => {}); }
  else aud.pause();
};
seek.oninput = () => { base = +seek.value; t0 = performance.now(); aud.currentTime = base; };
AnimalVideo.sceneList().forEach(s => {
  const b = document.createElement('button');
  b.className = 'alt'; b.textContent = s.def.id;
  b.onclick = () => { seek.value = s.start + 0.35; seek.oninput(); };
  document.getElementById('jumps').appendChild(b);
});
window.__ready.then(frame);
</script>
